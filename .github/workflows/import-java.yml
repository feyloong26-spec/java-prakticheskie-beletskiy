name: Import Java practical works
on: push
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified project
        env:
          PROJECT_ZIP: ""
        run: |
          python3 - <<'PY'
          import os,base64,io,zipfile,hashlib,pathlib
          data=base64.b64decode(os.environ['PROJECT_ZIP'])
          assert hashlib.sha256(data).hexdigest()=="57495e27f350d3f09a243cae0a82e889d5f0ec6b4c16435ba7a539c70e6addb8"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for member in archive.infolist():
                  path=pathlib.PurePosixPath(member.filename)
                  assert path.parts[0]=='java-prakticheskie-beletskiy'
                  relative=pathlib.Path(*path.parts[1:])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  relative.parent.mkdir(parents=True,exist_ok=True)
                  relative.write_bytes(archive.read(member))
          PY
      - name: Commit Java project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-java.yml
          git add src .run docs pom.xml README.md .gitignore
          git commit -m "Add Java practical works for Beletskiy, UIBO-03-24"
          git push origin HEAD:main
